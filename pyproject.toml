[project]
name = "regressiongate"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.14.0",
    "pydantic>=2.14.1",
    "typer>=0.27.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
rgate = "cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat layout: top-level packages and cli.py live at the repo root, not under src/.
only-include = ["agent", "tracing", "datasets", "evals", "cli.py"]
